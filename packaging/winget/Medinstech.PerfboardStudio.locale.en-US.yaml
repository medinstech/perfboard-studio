ShortDescription: Perfboard layout designer with a step-by-step soldering guide.
Description: |-
  A desktop app where you draw a circuit, lay it out on perfboard -- or on stripboard, or
  on a solderless breadboard first -- let the router work out the connections, prove the
  board matches the schematic, and get a step-by-step build guide with measurement
  checkpoints. Netlist-driven placement and routing, perfboard-specific design rules and
  layout-vs-schematic verification. English and Turkish.

  The 3D package models are KiCad's, CC-BY-SA 4.0 with KiCad's design exception; boards
  designed with the application are unaffected.
